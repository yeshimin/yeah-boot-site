# YeahBoot 三个前端站点与一个后端 API 的 Nginx 配置。
#
# 静态发布目录：
# - /var/www/yeahboot/site   → yeahboot.com
# - /var/www/yeahboot/docs   → docs.yeahboot.com
# - /var/www/yeahboot/admin  → demo.yeahboot.com
#
# 后端服务：
# - 127.0.0.1:8080           → /api/** 转发至 yeah-admin
#
# 使用一个 SAN 证书覆盖三个域名。首次签发示例：
# certbot certonly --nginx --cert-name yeahboot.com \
#   -d yeahboot.com -d docs.yeahboot.com -d demo.yeahboot.com
#
# 配置完成后执行：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name yeahboot.com docs.yeahboot.com demo.yeahboot.com;

    return 301 https://$host$request_uri;
}

# 官网：yeah-boot-site，原生静态 HTML/CSS/JavaScript。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yeahboot.com;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yeahboot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeahboot.com/privkey.pem;
    ssl_session_cache shared:yeahboot_ssl:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/yeahboot/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

# 文档站：yeah-boot-docs，VitePress 静态构建产物。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.yeahboot.com;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yeahboot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeahboot.com/privkey.pem;
    ssl_session_cache shared:yeahboot_ssl:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/yeahboot/docs;
    index index.html;

    # VitePress cleanUrls：/guide/quick-start → /guide/quick-start.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # VitePress 构建资源带内容哈希，可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

# 管理后台：yeah-boot-admin，/api/ 同源代理至后端 yeah-admin。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.yeahboot.com;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yeahboot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeahboot.com/privkey.pem;
    ssl_session_cache shared:yeahboot_ssl:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/yeahboot/admin;
    index index.html;
    client_max_body_size 20m;

    # /api/admin/auth/login → http://127.0.0.1:8080/admin/auth/login
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vue Router 历史路由回退到入口文件。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
